<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALXZN STORE - Venta de Cuentas FF</title>
    <style>
        :root {
            --red: #ff0000;
            --dark: #0d0d0d;
            --card: #1a1a1a;
        }
        body { 
            background-color: var(--dark); 
            color: white; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            text-align: center; 
        }
        header { 
            background: linear-gradient(180deg, #ff0000 0%, #660000 100%); 
            padding: 30px; 
            font-size: 28px; 
            font-weight: bold; 
            border-bottom: 4px solid white;
            text-transform: uppercase;
        }
        .container { 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }
        .card { 
            background: var(--card); 
            border: 2px solid var(--red); 
            border-radius: 20px; 
            margin: 20px; 
            padding: 20px; 
            width: 90%; 
            max-width: 400px; 
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
        }
        .card img { 
            width: 100%; 
            border-radius: 10px; 
            border: 2px solid #333; 
            margin-bottom: 15px;
            display: block;
        }
        .price { 
            font-size: 26px; 
            color: #00ff00; 
            margin: 15px 0; 
            font-weight: bold; 
        }
        .btn { 
            display: block; 
            padding: 15px; 
            margin: 10px 0; 
            text-decoration: none; 
            border-radius: 12px; 
            font-weight: bold; 
            font-size: 18px;
            transition: 0.2s;
        }
        .btn-wa { background-color: #25d366; color: white; }
        .btn-pp { background-color: #0070ba; color: white; }
        .btn:active { transform: scale(0.95); }
        footer { 
            padding: 30px; 
            font-size: 14px; 
            color: #777; 
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

<header>🔥 ALXZN STORE 🔥</header>

<div class="container">

    <div class="card">
        <h3>CUENTA NIVEL ALTO #1</h3>
        <img src="fotech.jpg.JPG" alt="Cuenta FF 1">
        <div class="price">$15.00 USD</div>
        <a href="https://wa.me/5547997096706?text=Hola%20Alxzn,%20me%20interesa%20la%20Cuenta%201" class="btn btn-wa">WHATSAPP VENTAS</a>
        <a href="https://www.paypal.com/paypalme/alejandropenalopez" class="btn btn-pp">PAGAR CON PAYPAL</a>
    </div>

    <div class="card">
        <h3>CUENTA EXCLUSIVA #2</h3>
        <img src="foto2.jpg.JPG" alt="Cuenta FF 2">
        <div class="price">$30.00 USD</div>
        <a href="https://wa.me/5547997096706?text=Hola%20Alxzn,%20me%20interesa%20la%20Cuenta%202" class="btn btn-wa">WHATSAPP VENTAS</a>
        <a href="https://www.paypal.com/paypalme/alejandropenalopez" class="btn btn-pp">PAGAR CON PAYPAL</a>
    </div>

</div>

<footer>
    📍 Balneário Camboriú, SC <br>
    Ventas 100% Seguras <br>
    &copy; 2026 Alxzn Store
</footer>

</body>
</html>
