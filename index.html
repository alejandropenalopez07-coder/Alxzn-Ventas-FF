<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALXZN FF STORE | Oficial</title>

    <style>
        :root {
            --cyan: #00ffff;
            --red: #ff2a2a;
            --blue: #0070ff;
            --green: #22c55e;
            --dark: #020617;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(circle at top, #0f172a, #000);
            color: white;
            text-align: center;
            min-height: 100vh;
            padding-bottom: 50px;
            overflow-x: hidden;
        }

        /* FONDO DINÁMICO GAMER */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(0, 255, 255, 0.05), transparent 70%);
            z-index: -1;
            animation: pulse 8s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.5; transform: scale(1); }
            to { opacity: 1; transform: scale(1.2); }
        }

        h1 {
            margin-top: 40px;
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #fff;
            text-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan);
        }

        .subtitle {
            color: #94a3b8;
            font-size: 0.85rem;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* CONTENEDOR DE PRODUCTOS */
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 15px;
        }

        .card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            width: 90%;
            max-width: 320px;
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            transition: 0.3s;
            position: relative;
            overflow: hidden;
        }

        .card:hover {
            transform: translateY(-8px);
            border-color: var(--cyan);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
        }

        .price {
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--cyan);
            margin: 15px 0;
            text-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
        }

        /* BOTONES CON EFECTO PRO */
        .btn {
            width: 100%;
            margin: 10px 0;
            padding: 16px;
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
            display: block;
        }

        .paypal { background: linear-gradient(135deg, #ff2a2a, #990000); box-shadow: 0 4px 15px rgba(255,42,42,0.3); }
        .pix { background: linear-gradient(135deg, #0070ff, #003cff); box-shadow: 0 4px 15px rgba(0,112,255,0.3); }
        .whatsapp { background: linear-gradient(135deg, #22c55e, #15803d); box-shadow: 0 4px 15px rgba(34,197,94,0.3); }

        .btn:active {
            transform: scale(0.92) translateY(4px);
            filter: brightness(0.8);
        }

        /* BARRA INSTAGRAM */
        .insta-bar {
            margin-top: 40px;
        }

        .insta-bar a {
            text-decoration: none;
            color: white;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            display: inline-block;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .insta-bar a:active { transform: scale(0.9); }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<h1>🔥 ALXZN FF STORE</h1>
<div class="subtitle">
    <span>⚡ COMPRA SEGURA</span>
    <span>•</span>
    <span>📦 ENTREGA INSTANTÁNEA</span>
</div>

<div class="container">
    <div class="card">
        <h3>💎 CUENTA PRO</h3>
        <div class="price">$25</div>
        <button class="btn paypal" onclick="paypal()">💰 PAYPAL</button>
        <button class="btn pix" onclick="pix()">💳 COPIAR PIX</button>
        <button class="btn whatsapp" onclick="wa('Cuenta Pro')">💬 CONFIRMAR</button>
    </div>

    <div class="card">
        <h3>🔥 NIVEL 73</h3>
        <div class="price">$25</div>
        <button class="btn paypal" onclick="paypal()">💰 PAYPAL</button>
        <button class="btn pix" onclick="pix()">💳 COPIAR PIX</button>
        <button class="btn whatsapp" onclick="wa('Cuenta Nivel 73')">💬 CONFIRMAR</button>
    </div>
</div>

<div class="insta-bar">
    <a href="https://instagram.com/alxzn.cria" target="_blank">📸 @ALXZN.CRIA</a>
</div>

<script>
    function paypal() {
        window.open("https://www.paypal.com/paypalme/alejandropenalopez07");
    }

    function pix() {
        navigator.clipboard.writeText("09075658915");
        alert("✅ CLAVE PIX COPIADA\n\nYa puedes pegarla en tu aplicación bancaria.");
    }

    function wa(producto) {
        let msg = "¡Hola Alejandro! Acabo de pagar por la " + producto + ". ¿Me confirmas para recibir los datos? 🔥";
        window.location.href = "https://wa.me/5351042240?text=" + encodeURIComponent(msg);
    }
</script>

</body>
</html>
