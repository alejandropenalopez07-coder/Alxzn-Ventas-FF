    <style>
        :root {
            --cyan: #00ffff;
            --fuchsia: #ff00ff;
            --dark: #020617;
            --card-bg: #0f172a;
        }

        body {
            background-color: var(--dark);
            color: #e2e8f0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding-bottom: 110px;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 15% 20%, rgba(0, 255, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(255, 0, 255, 0.08) 0%, transparent 40%);
            z-index: -1;
        }

        header {
            width: 100%;
            padding: 30px 0;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 28px;
            font-weight: 900;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            background: linear-gradient(90deg, var(--cyan), var(--fuchsia));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .container {
            width: 90%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: 0.3s;
        }

        .card:hover { border-color: var(--fuchsia); }

        .card h3 {
            font-size: 16px;
            color: #fff;
            margin: 0 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .card img {
            width: 100%;
            border-radius: 15px;
            margin-bottom: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .price {
            font-size: 30px;
            font-weight: 800;
            color: var(--cyan);
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 14px;
            font-weight: 800;
            font-size: 13px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid transparent;
        }

        .btn-cyan {
            background: rgba(0, 255, 255, 0.05);
            color: var(--cyan);
            border-color: rgba(0, 255, 255, 0.4);
        }

        .btn-cyan:hover {
            background: rgba(0, 255, 255, 0.15);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        .btn-fuchsia {
            background: rgba(255, 0, 255, 0.05);
            color: var(--fuchsia);
            border-color: rgba(255, 0, 255, 0.4);
        }

        .btn-fuchsia:hover {
            background: rgba(255, 0, 255, 0.15);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.3);
        }

        /* --- WHATSAPP FLOTANTE --- */
        .wa-float {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            z-index: 1000;
        }

        .wa-label {
            background: #ff3366;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .wa-icon {
            width: 65px;
            height: 65px;
            background: #25d366;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
        }

        .wa-icon svg { width: 35px; height: 35px; fill: white; }

        footer {
            margin-top: 40px;
            padding: 30px;
            font-size: 14px;
            font-weight: bold;
            color: var(--fuchsia);
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
